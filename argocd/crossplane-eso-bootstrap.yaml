# The ArgoCD App of Apps for all Crossplane components
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-eso-bootstrap
  namespace: argocd
  labels:
    crossplane.jonashackt.io: bootstrap
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jonashackt/crossplane-argocd
    path: argocd/crossplane-eso-bootstrap
    targetRevision: HEAD
    # dynamically set all Child Applications to the repo's Git revision with this ArgoCD Kustomize inline patch using helm
    helm:
      parameters:
        - name: revision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
          # see https://argo-cd.readthedocs.io/en/latest/user-guide/helm/?#helm-parameters
          # & https://argo-cd.readthedocs.io/en/stable/user-guide/build-environment/
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true    
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 1
      backoff:
        duration: 5s 
        factor: 2 
        maxDuration: 1m