name: crossplane-argocd

on: [push]

env:
  # AWS
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'eu-central-1'
  # Branch name for our App-of-Apps
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup ArgoCD CLI in GitHub Actions
        uses: imajeetyadav/argocd-cli@v2

      - name: Spin up kind
        uses: helm/kind-action@v1.15.1
        with:
          wait: 5m

      - name: Determine the images of our ArgoCD install
        id: argocd-images
        run: |
          echo "--- This step retrieves all images used in the ArgoCD install manifests like: ghcr.io/dexidp/dex:v2.45.1 public.ecr.aws/docker/library/redis:8.2.3-alpine quay.io/argoproj/argocd:v3.5.2"
          echo "images=$(kubectl kustomize argocd/install | grep -E '^\s+image:' | sed 's/^\s*image: //' | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Preload ArgoCD images into kind (cached & with retries, to survive registry rate limits)
        uses: ./.github/actions/kind-preload-images
        with:
          images: ${{ steps.argocd-images.outputs.images }}

      - name: Install ArgoCD into kind
        run: |
          echo "--- Let's try to access our kind cluster via kubectl"
          kubectl get nodes

          echo " Install & configure ArgoCD via Kustomize - see https://stackoverflow.com/a/71692892/4964553"
          kubectl apply --server-side --force-conflicts -k argocd/install
          
          echo "--- Wait for Argo to become ready"
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server --namespace argocd --timeout=300s

          echo "--- Also wait for redis & the repo-server, since 'argocd app create' renders the manifests through the repo-server, which needs redis (a failed redis image pull otherwise ends in 'DeadlineExceeded')"
          kubectl rollout status deployment/argocd-redis -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=300s

      - name: Prepare crossplane AWS Secret
        run: |
          echo "--- Create aws-creds.conf file"
          echo "[default]
          aws_access_key_id = $AWS_ACCESS_KEY_ID
          aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          " > aws-creds.conf
          
          echo "--- Create a namespace for crossplane"
          kubectl create namespace crossplane-system

          echo "--- Create AWS Provider secret"
          kubectl create secret generic aws-creds -n crossplane-system --from-file=creds=./aws-creds.conf

      - name: Prepare Secret with ArgoCD API Token for Crossplane ArgoCD Provider
        run: |
          echo "--- Access the ArgoCD server with a port-forward in the background, see https://stackoverflow.com/a/72983554/4964553 - and ignoring broken pipe errors"
          kubectl port-forward -n argocd --address='0.0.0.0' service/argocd-server 8443:443 2> >(grep -v "broken pipe" >&2) &
          echo "--- Wait shortly to let the port forward come available"
          sleep 1

          bash create-argocd-api-token-secret.sh

      - name: Use ArgoCD's AppOfApps pattern to deploy all Crossplane components
        run: |
          echo "--- Access the ArgoCD server with a port-forward in the background, see https://stackoverflow.com/a/72983554/4964553 - and ignoring broken pipe errors"
          kubectl port-forward -n argocd --address='0.0.0.0' service/argocd-server 8080:80 2> >(grep -v "broken pipe" >&2) &
          echo "--- Wait shortly to let the port forward become available"
          sleep 1

          echo "--- Login to our argocd instance first on order to be able to use the argocd commands without Unauthenticated errors"
          argocd login localhost:8080 --username admin --password $(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo) --insecure

          echo "--- Let Argo do it's magic installing all Crossplane components"
          echo "--- Create the App-of-Apps Application directly with the targetRevision '$BRANCH_NAME' (instead of kubectl apply + argocd app set, which would let all Child Applications start on HEAD first and then switch mid-flight), which will then be populated via Helm/ArgoCD to all Child Applications, see https://argo-cd.readthedocs.io/en/latest/user-guide/helm/?#helm-parameters"
          argocd app create --file argocd/crossplane-bootstrap.yaml --revision "$BRANCH_NAME" --upsert

      - name: Check crossplane status
        run: |
          echo "--- Wait for crossplane to become ready (now prefaced with until as described in https://stackoverflow.com/questions/68226288/kubectl-wait-not-working-for-creation-of-resources)"
          until kubectl wait --for=condition=PodScheduled pod -l app=crossplane --namespace crossplane-system --timeout=120s > /dev/null 2>&1; do : ; done
          kubectl wait --for=condition=ready pod -l app=crossplane --namespace crossplane-system --timeout=120s

          echo "--- Wait until AWS Provider is up and running (now prefaced with until to prevent Error from server (NotFound): providers.pkg.crossplane.io 'upbound-provider-aws-s3' not found)"
          until kubectl get provider/upbound-provider-aws-s3 > /dev/null 2>&1; do : ; done
          kubectl wait --for=condition=healthy --timeout=180s provider/upbound-provider-aws-s3

          kubectl get all -n crossplane-system

      - name: Debug output on failure
        if: failure()
        run: |
          echo "--- ArgoCD pods"
          kubectl get pods -n argocd -o wide || true
          echo "--- ArgoCD repo-server (renders the manifests for 'argocd app create')"
          kubectl describe pods -n argocd -l app.kubernetes.io/name=argocd-repo-server || true
          kubectl logs -n argocd -l app.kubernetes.io/name=argocd-repo-server --tail=200 || true
          echo "--- ArgoCD server logs"
          kubectl logs -n argocd -l app.kubernetes.io/name=argocd-server --tail=100 || true
          echo "--- ArgoCD NetworkPolicies & Events"
          kubectl get networkpolicy -n argocd || true
          kubectl get events -n argocd --sort-by=.lastTimestamp || true
          echo "--- ArgoCD Applications"
          kubectl get applications.argoproj.io -n argocd || true
          echo "--- Crossplane Providers & ProviderRevisions"
          kubectl get providers,providerrevisions,functions,functionrevisions || true
          kubectl describe providers || true
          kubectl describe providerrevisions || true
          echo "--- Pods & Events in crossplane-system"
          kubectl get pods -n crossplane-system -o wide || true
          kubectl get events -n crossplane-system --sort-by=.lastTimestamp || true
          echo "--- Crossplane logs"
          kubectl logs -n crossplane-system -l app=crossplane --tail=100 || true